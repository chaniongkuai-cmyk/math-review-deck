<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>澳門四校聯考（JAE）數學總複習</title>
  <script>
    (function() {
      // 檢查使用者是否明確指定模式
      const urlParams = new URLSearchParams(window.location.search);
      const mode = urlParams.get('mode');
      
      let target = 'demo/index.html';
      if (mode === 'mobile') {
        target = 'demo/mobile.html';
      } else if (mode === 'desktop') {
        target = 'demo/index.html';
      } else {
        // 自動檢測是否為手機/窄螢幕設備
        const isMobile = /Android|webOS|iPhone|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 768;
        if (isMobile) {
          target = 'demo/mobile.html';
        } else {
          target = 'demo/index.html';
        }
      }
      
      const search = window.location.search;
      const hash = window.location.hash;
      window.location.replace(target + search + hash);
    })();
  </script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 60px 20px;
      color: #334155;
      background: #f8fafc;
    }
    h1 { font-size: 20px; margin-bottom: 12px; color: #0f172a; }
    p { font-size: 14px; margin-bottom: 24px; color: #64748b; }
    .btn-group { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn {
      padding: 12px 20px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      transition: all 0.2s;
    }
    .btn-mobile { background: #2563eb; color: #fff; }
    .btn-desktop { background: #e2e8f0; color: #1e293b; }
  </style>
</head>
<body>
  <h1>澳門四校聯考（JAE）數學總複習</h1>
  <p>正在為您導向適合您設備的最佳版本…</p>
  <div class="btn-group">
    <a href="demo/mobile.html" class="btn btn-mobile">📱 手機/平板題號速查版</a>
    <a href="demo/index.html" class="btn btn-desktop">🖥️ 電腦課堂簡報版</a>
  </div>
</body>
</html>
